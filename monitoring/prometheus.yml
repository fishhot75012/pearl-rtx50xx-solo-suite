global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'pearld-node'
    static_configs:
      - targets: ['localhost:9105']

  - job_name: 'vllm-miner'
    static_configs:
      - targets: ['localhost:8000']

  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['localhost:9400']

  - job_name: 'pearl-solo-blocks'
    static_configs:
      - targets: ['localhost:9401']
